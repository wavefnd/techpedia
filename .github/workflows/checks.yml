name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run test --prefix web
      - run: npm run build --prefix web
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/auth ./internal/storage ./internal/server ./internal/techmark
      - run: go mod download all
      - run: go run ./scripts/notices
      - run: git diff --check
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: ./tests/run.sh integration
      - run: python3 -m unittest discover -s benchmark/tests
