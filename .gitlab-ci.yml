stages: [build, test]

web:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci --prefix web
    - npm run typecheck --prefix web
    - npm run test --prefix web
    - npm run build --prefix web
    - node --test scripts/tests/*.test.mjs
  artifacts:
    paths: [internal/server/static/dist]
    expire_in: 1 day

documentation:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci --prefix docs
    - DOCS_BASE=/techpedia/ npm run build --prefix docs
  artifacts:
    paths: [docs/.vitepress/dist]
    expire_in: 1 day

go:
  stage: test
  image: golang:1.26.8-bookworm
  needs: [web]
  script:
    - go test ./...
    - go vet ./...
    - go test -race ./internal/auth ./internal/storage ./internal/server ./internal/techmark
    - bash -n start.sh restart.sh stop.sh backup.sh restore.sh move.sh scripts/export-public.sh
